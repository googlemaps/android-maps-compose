# Builds and tests the iOS side of maps-compose-multiplatform and the iOS demo app. The Android
# side is covered by the other workflows; iOS can only be built on macOS.
name: Multiplatform (iOS)

on:
  pull_request:
    branches-ignore: ['gh-pages']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      # Compiles both iOS targets, runs the iOS simulator tests, checks the public API of every
      # target against api/, and links the framework the iOS app embeds.
      - name: Build and test the iOS targets
        run: >-
          ./gradlew --stacktrace
          :maps-compose-multiplatform:iosSimulatorArm64Test
          :maps-compose-multiplatform:checkKotlinAbi
          :maps-compose-multiplatform:linkPodDebugFrameworkIosSimulatorArm64
          :maps-compose-multiplatform:linkPodDebugFrameworkIosArm64

      # The app reads its key from secrets.properties at build time and falls back to a
      # placeholder, which is enough to compile.
      - name: Build the iOS demo app
        working-directory: iosApp
        run: |
          (cd .. && ./gradlew :maps-compose-multiplatform:generateDummyFramework)
          ruby create_project.rb
          pod install
          xcodebuild build \
            -workspace iosApp.xcworkspace \
            -scheme iosApp \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO
