name: Auto-Fix and PR Creator

on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      number:
        description: 'Issue number to fix'
        required: true
      title:
        description: 'Issue Title'
        required: true
      body:
        description: 'Issue Body'
        required: true

concurrency:
  group: auto-fix-${{ github.event.issue.number || github.event.inputs.number || github.run_id }}
  cancel-in-progress: true

jobs:
  auto-fix:
    if: >-
      github.event.label.name == 'agent: create-pr' ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # Keep credentials out of .git/config so the generated code compiled below cannot read them.
          # Only the push step authenticates.
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.x'

      - name: Run Auto-Fix Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          ISSUE_TITLE: ${{ github.event.issue.title || github.event.inputs.title }}
          ISSUE_BODY: ${{ github.event.issue.body || github.event.inputs.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number || github.event.inputs.number }}
        run: |
          python .github/scripts/create_pr.py

      - name: Verify Compilation
        id: compile_check
        run: |
          # Try compiling to ensure the generated code is correct
          ./gradlew compileDebugKotlin --no-daemon || echo "failed" > compile_status.txt

      - name: Report Compilation Failure
        if: hashFiles('compile_status.txt') != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number || github.event.inputs.number }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --body "⚠️ The **Auto-Fix Agent** attempted to generate a patch for this issue, but the code failed to compile. Maintainers have been notified to inspect the changes manually."
          gh issue edit "$ISSUE_NUMBER" --remove-label "agent: create-pr" || true
          exit 1

      - name: Push Changes and Create Pull Request
        # Use GITHUB_TOKEN (never SYNCED_GITHUB_TOKEN_REPO) and open as a draft PR so that
        # downstream pull_request workflows do not automatically execute unreviewed AI-generated
        # code with repository secrets before a human maintainer inspects the diff.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number || github.event.inputs.number }}
        run: |
          # Read metadata generated by Python script
          BRANCH_NAME=$(jq -r '.branch_name' pr_metadata.json)
          COMMIT_MESSAGE=$(jq -r '.commit_message' pr_metadata.json)
          PR_TITLE=$(jq -r '.pr_title' pr_metadata.json)
          PR_BODY=$(jq -r '.pr_body' pr_metadata.json)

          if [[ ! "$BRANCH_NAME" =~ ^auto-fix/issue-[0-9]+$ ]]; then
            echo "::error::Refusing unexpected branch name: $BRANCH_NAME"
            exit 1
          fi

          # Create branch and commit only the files create_pr.py validated
          mapfile -t CHANGED_FILES < <(jq -r '.files[]' pr_metadata.json)
          if [ "${#CHANGED_FILES[@]}" -eq 0 ]; then
            echo "::error::No changed files recorded in pr_metadata.json"
            exit 1
          fi

          # Git configuration
          git config --global user.name "googlemaps-bot"
          git config --global user.email "googlemaps-bot@google.com"

          git checkout -b "$BRANCH_NAME"
          git add -- "${CHANGED_FILES[@]}"
          git commit -m "$COMMIT_MESSAGE"

          # Push branch (fetch existing remote branch ref if re-running on the same issue)
          gh auth setup-git
          git fetch origin "$BRANCH_NAME" 2>/dev/null || true
          git push --force-with-lease origin "$BRANCH_NAME"

          # Create Draft Pull Request (or update existing open PR for this branch)
          if [ -n "$(gh pr list --head "$BRANCH_NAME" --state open --json number --jq '.[].number')" ]; then
            gh pr edit "$BRANCH_NAME" --title "$PR_TITLE" --body "$PR_BODY"
          else
            gh pr create \
              --draft \
              --title "$PR_TITLE" \
              --body "$PR_BODY" \
              --head "$BRANCH_NAME" \
              --base main
          fi

          # Add a comment to the issue
          gh issue comment "$ISSUE_NUMBER" --body "🚀 The **Auto-Fix Agent** has generated a patch and opened a draft Pull Request to address this issue. A maintainer will review the proposed changes before running full CI."

          # Remove 'agent: create-pr' label
          gh issue edit "$ISSUE_NUMBER" --remove-label "agent: create-pr" || true
