name: Auto-Fix and PR Creator

# The patch is generated from untrusted issue content, so the work is split into
# three jobs that never share a runner:
#
#   1. generate - holds GEMINI_API_KEY and a read-only token. Writes the
#                 patch and PR metadata, uploads them as an artifact, and
#                 never runs Gradle or any other generated code.
#   2. compile  - runs Gradle on the patched tree with no secrets and a
#                 read-only token. This is the only job that runs generated code.
#   3. publish  - holds the write token. Checks the artifact digest, checks the
#                 patch again with the trusted scripts from the base commit,
#                 then pushes the branch and opens a draft PR. It never runs
#                 Gradle or any other generated code.

on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      number:
        description: 'Issue number to fix'
        required: true
      title:
        description: 'Issue Title'
        required: true
      body:
        description: 'Issue Body'
        required: true

concurrency:
  group: auto-fix-${{ github.event.issue.number || github.event.inputs.number || github.run_id }}
  cancel-in-progress: true

# Deny everything by default; each job opts in to the minimum it needs.
permissions: {}

jobs:
  generate:
    if: >-
      github.event.label.name == 'agent: create-pr' ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      patch-sha256: ${{ steps.package.outputs.patch-sha256 }}
      metadata-sha256: ${{ steps.package.outputs.metadata-sha256 }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check for Existing Auto-Fix Branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number || github.event.inputs.number }}
        run: |
          if [[ ! "$ISSUE_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "::error::Invalid ISSUE_NUMBER: $ISSUE_NUMBER"
            exit 1
          fi
          BRANCH_NAME="auto-fix/issue-$ISSUE_NUMBER"
          if git show-ref --verify --quiet "refs/remotes/origin/$BRANCH_NAME"; then
            echo "::error::Remote branch $BRANCH_NAME already exists; refusing to overwrite."
            gh issue comment "$ISSUE_NUMBER" --body "ℹ️ Branch \`$BRANCH_NAME\` already exists. Refusing to overwrite it in case commits were added during review — delete the branch first if you want the **Auto-Fix Agent** to generate a fresh patch."
            gh issue edit "$ISSUE_NUMBER" --remove-label "agent: create-pr" || true
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.x'

      - name: Run Auto-Fix Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          ISSUE_TITLE: ${{ github.event.issue.title || github.event.inputs.title }}
          ISSUE_BODY: ${{ github.event.issue.body || github.event.inputs.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number || github.event.inputs.number }}
        run: |
          python .github/scripts/create_pr.py

      - name: Package Patch
        id: package
        env:
          OUT_DIR: ${{ runner.temp }}/autofix
        run: |
          mkdir -p "$OUT_DIR"
          mapfile -t CHANGED_FILES < <(jq -r '.files[]' pr_metadata.json)
          if [ "${#CHANGED_FILES[@]}" -eq 0 ]; then
            echo "::error::No changed files recorded in pr_metadata.json"
            exit 1
          fi
          # Mark new files as intent-to-add so `git diff` includes them.
          git add --intent-to-add -- "${CHANGED_FILES[@]}"
          git diff --binary -- "${CHANGED_FILES[@]}" > "$OUT_DIR/autofix.patch"
          cp pr_metadata.json "$OUT_DIR/pr_metadata.json"
          echo "patch-sha256=$(sha256sum "$OUT_DIR/autofix.patch" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "metadata-sha256=$(sha256sum "$OUT_DIR/pr_metadata.json" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Upload Patch Artifact
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: autofix-patch-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/autofix/
          if-no-files-found: error
          retention-days: 1

  compile:
    needs: generate
    runs-on: ubuntu-latest
    # Generated code runs here. No secrets and a read-only token.
    permissions:
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download Patch Artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.generate.outputs.artifact-id }}
          path: ${{ runner.temp }}/autofix

      - name: Apply Patch
        env:
          PATCH_DIR: ${{ runner.temp }}/autofix
          EXPECTED_PATCH_SHA256: ${{ needs.generate.outputs.patch-sha256 }}
        run: |
          PATCH="$(find "$PATCH_DIR" -name autofix.patch -type f | head -n 1)"
          echo "$EXPECTED_PATCH_SHA256  $PATCH" | sha256sum --check --strict
          git apply --index -- "$PATCH"

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Compilation
        run: ./gradlew compileDebugKotlin --no-daemon

  publish:
    needs: [generate, compile]
    # Run even if compilation failed so the issue gets a comment, but only if a patch exists.
    if: always() && needs.generate.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - name: Report Compilation Failure
        if: needs.compile.result != 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number || github.event.inputs.number }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --body "⚠️ The **Auto-Fix Agent** attempted to generate a patch for this issue, but the code failed to compile. Maintainers have been notified to inspect the changes manually."
          gh issue edit "$ISSUE_NUMBER" --remove-label "agent: create-pr" || true
          exit 1

      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # Keep credentials out of .git/config. Only the push step authenticates.
          persist-credentials: false

      - name: Download Patch Artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.generate.outputs.artifact-id }}
          path: ${{ runner.temp }}/autofix

      - name: Verify Artifact Integrity
        # The digests come from the trusted generate job. A mismatch means the
        # artifact changed after generate uploaded it, for example because the
        # compile job uploaded a replacement.
        env:
          PATCH_DIR: ${{ runner.temp }}/autofix
          EXPECTED_PATCH_SHA256: ${{ needs.generate.outputs.patch-sha256 }}
          EXPECTED_METADATA_SHA256: ${{ needs.generate.outputs.metadata-sha256 }}
        run: |
          PATCH="$(find "$PATCH_DIR" -name autofix.patch -type f | head -n 1)"
          METADATA="$(find "$PATCH_DIR" -name pr_metadata.json -type f | head -n 1)"
          echo "$EXPECTED_PATCH_SHA256  $PATCH" | sha256sum --check --strict
          echo "$EXPECTED_METADATA_SHA256  $METADATA" | sha256sum --check --strict
          echo "PATCH=$PATCH" >> "$GITHUB_ENV"
          echo "METADATA=$METADATA" >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.x'

      - name: Apply and Validate Patch
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number || github.event.inputs.number }}
        run: |
          git apply -- "$PATCH"
          # create_pr.py comes from the base commit, not from the patch, so it
          # can check that the patch touches only allowed .kt files.
          python .github/scripts/create_pr.py --verify-applied "$METADATA"

      - name: Push Changes and Create Pull Request
        # Use GITHUB_TOKEN (never SYNCED_GITHUB_TOKEN_REPO) and open as a draft PR so that
        # downstream pull_request workflows do not automatically execute unreviewed AI-generated
        # code with repository secrets before a human maintainer inspects the diff.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number || github.event.inputs.number }}
        run: |
          # Read metadata generated by the generate job (integrity-checked above)
          BRANCH_NAME=$(jq -r '.branch_name' "$METADATA")
          COMMIT_MESSAGE=$(jq -r '.commit_message' "$METADATA")
          PR_TITLE=$(jq -r '.pr_title' "$METADATA")
          PR_BODY=$(jq -r '.pr_body' "$METADATA")

          if [[ ! "$BRANCH_NAME" =~ ^auto-fix/issue-[0-9]+$ ]]; then
            echo "::error::Refusing unexpected branch name: $BRANCH_NAME"
            exit 1
          fi

          # Create branch and commit only the files create_pr.py validated
          mapfile -t CHANGED_FILES < <(jq -r '.files[]' "$METADATA")
          if [ "${#CHANGED_FILES[@]}" -eq 0 ]; then
            echo "::error::No changed files recorded in pr_metadata.json"
            exit 1
          fi

          # Git configuration
          git config --global user.name "googlemaps-bot"
          git config --global user.email "googlemaps-bot@google.com"

          git checkout -b "$BRANCH_NAME"
          git add -- "${CHANGED_FILES[@]}"
          git commit -m "$COMMIT_MESSAGE"

          # Bail out if the remote branch already exists so maintainer commits on an
          # existing auto-fix PR can never be overwritten.
          gh auth setup-git
          if git ls-remote --exit-code --heads origin "$BRANCH_NAME" >/dev/null 2>&1; then
            echo "::error::Remote branch $BRANCH_NAME already exists; refusing to overwrite."
            gh issue comment "$ISSUE_NUMBER" --body "ℹ️ Branch \`$BRANCH_NAME\` already exists. Refusing to overwrite it in case commits were added during review — delete the branch first if you want the **Auto-Fix Agent** to generate a fresh patch."
            gh issue edit "$ISSUE_NUMBER" --remove-label "agent: create-pr" || true
            exit 1
          fi
          git push origin "$BRANCH_NAME"

          # Create Draft Pull Request
          PR_URL=$(gh pr create \
            --draft \
            --title "$PR_TITLE" \
            --body "$PR_BODY" \
            --head "$BRANCH_NAME" \
            --base main)

          # Add a comment to the issue explaining how a maintainer triggers CI after reviewing the diff
          gh issue comment "$ISSUE_NUMBER" --body "🚀 The **Auto-Fix Agent** has generated a patch and opened a draft Pull Request ($PR_URL) to address this issue. Because the PR was opened with \`GITHUB_TOKEN\`, workflows do not run automatically — once a maintainer has reviewed the diff, **close and reopen the PR (or push a commit to \`$BRANCH_NAME\`)** and mark it ready for review to run the full CI suite."

          # Remove 'agent: create-pr' label
          gh issue edit "$ISSUE_NUMBER" --remove-label "agent: create-pr" || true
