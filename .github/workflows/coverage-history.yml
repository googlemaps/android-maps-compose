# Records unit test coverage in coverage/history.csv after every merge to main,
# so coverage can be tracked over time. Release-please commits and the
# workflow's own commits are skipped.
name: Record coverage history

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Serialize runs so two quick merges cannot race on pushing the history file.
concurrency:
  group: coverage-history
  cancel-in-progress: false

jobs:
  record:
    # Skip release-please's release commits and this workflow's own commits.
    # (The commit below carries [skip ci] as well, and pushes made with
    # GITHUB_TOKEN do not trigger workflows, so this is belt and braces.)
    if: >-
      !startsWith(github.event.head_commit.message, 'chore(main): release') &&
      !startsWith(github.event.head_commit.message, 'chore: update coverage history')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read      # to download the pull request's instrumentation artifact
      pull-requests: read

    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.SYNCED_GITHUB_TOKEN_REPO || secrets.GITHUB_TOKEN }}

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Run unit tests and generate coverage reports
        run: ./gradlew koverXmlReportDebug --stacktrace

      # Instrumentation tests need an emulator on an expensive macOS runner, and
      # they already ran on the pull request. Reuse that run's artifact instead
      # of running the emulator again. Best effort: if the PR predates this
      # workflow, the run failed, or the artifact expired, only unit coverage is
      # recorded for this commit.
      - name: Download instrumentation coverage from the pull request run
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          PR=$(git log -1 --pretty=%s | sed -n 's/.*(#\([0-9]\{1,\}\))$/\1/p')
          if [ -z "$PR" ]; then
            echo "No pull request in the commit subject; skipping instrumentation."
            exit 0
          fi

          # A pull_request-triggered run is keyed by the PR's head commit, not
          # by the squash commit that landed on main.
          HEAD_SHA=$(gh api "repos/$REPO/pulls/$PR" --jq .head.sha)
          RUN=$(gh api \
            "repos/$REPO/actions/workflows/instrumentation-test.yml/runs?head_sha=$HEAD_SHA" \
            --jq '[.workflow_runs[] | select(.conclusion == "success")] | first | .id // empty')
          if [ -z "$RUN" ]; then
            echo "No successful instrumentation run for $HEAD_SHA; skipping."
            exit 0
          fi

          gh run download "$RUN" --repo "$REPO" \
            --name instrumentation-coverage --dir instrumentation-coverage
          ls -l instrumentation-coverage

      - name: Append to coverage history
        run: |
          SUBJECT=$(git log -1 --pretty=%s)
          # Squash-merged PRs end their subject with "(#123)". The number is
          # recorded in its own column, so drop it from the subject text.
          PR=$(printf '%s' "$SUBJECT" | sed -n 's/.*(#\([0-9]\{1,\}\))$/\1/p')
          SUBJECT=$(printf '%s' "$SUBJECT" | sed 's/ (#[0-9]\{1,\})$//')

          python3 .github/scripts/coverage_history.py append --suite unit \
            --commit "${{ github.sha }}" --pr "$PR" --subject "$SUBJECT"

          python3 .github/scripts/coverage_history.py append --suite instrumentation \
            --reports 'instrumentation-coverage/*.xml' --optional \
            --commit "${{ github.sha }}" --pr "$PR" --subject "$SUBJECT"

          python3 .github/scripts/coverage_history.py render

      - name: Commit coverage history
        run: |
          git config user.name 'googlemaps-bot'
          git config user.email 'googlemaps-bot@google.com'
          git add coverage/history.csv coverage/COVERAGE.md
          if git diff --staged --quiet; then
            echo "Coverage history unchanged; nothing to commit."
            exit 0
          fi
          git commit -m 'chore: update coverage history [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
