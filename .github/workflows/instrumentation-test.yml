# A workflow that runs tests on every new pull request
name: Run instrumentation tests

on:
  repository_dispatch:
    types: [test]
  pull_request:
    branches-ignore: ['gh-pages']
  workflow_dispatch:

jobs:
  run-instrumentation-test:
    runs-on: macOS-latest-large # enables hardware acceleration in the virtual machine
    permissions:
      pull-requests: write
    timeout-minutes: 30
    steps:
    - name: Checkout Repo
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up JDK 21
      uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

    - name: Inject Maps API Key
      env:
        MAPS_API_KEY: ${{ secrets.ACTIONS_API_KEY }}
      run: |
        [ -z "$MAPS_API_KEY" ] && MAPS_API_KEY="YOUR_API_KEY"; echo "MAPS_API_KEY=$MAPS_API_KEY" >> ./secrets.properties

    - name: Build debug
      run: ./gradlew assembleDebug

    - name: Run instrumentation tests
      uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
      with:
        api-level: 29
        target: google_apis
        arch: x86
        disable-animations: true
        script: ./gradlew createDebugCoverageReport --stacktrace

    - name: Jacoco Report to PR
      id: jacoco
      uses: madrapps/jacoco-report@e51ce1f46f7f8b5331593f935e59cbaf44b84920 # v1.8.0
      with:
        paths: |
          ${{ github.workspace }}/maps-app/build/reports/coverage/androidTest/debug/connected/report.xml
        token: ${{ secrets.SYNCED_GITHUB_TOKEN_REPO }}
        min-coverage-overall: 26
        min-coverage-changed-files: 60
        title: Code Coverage
        debug-mode: false
        update-comment: true

    - name: Get the Coverage info
      env:
        COVERAGE_OVERALL: ${{ steps.jacoco.outputs.coverage-overall }}
        COVERAGE_CHANGED_FILES: ${{ steps.jacoco.outputs.coverage-changed-files }}
      run: |
            echo "Total coverage $COVERAGE_OVERALL"
            echo "Changed Files coverage $COVERAGE_CHANGED_FILES"

    - name: Upload test reports
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: test-reports
        path: ./maps-app/build/reports
